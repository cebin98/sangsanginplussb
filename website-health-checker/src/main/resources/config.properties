# 웹사이트 헬스체크 설정 파일
# ==========================================

# 텔레그램 봇 설정
# BotFather에서 발급받은 토큰을 입력하세요
telegram.bot.token=7803862439:AAFcutbdN9ULJB3SUv88PAMcFEdzBZmamvY

# 알림을 받을 채팅 ID (개인 또는 그룹)
telegram.chat.id=-5115413916

# ==========================================
# 체크할 웹사이트 목록 (쉼표로 구분)
# ==========================================
websites=https://www.sangsanginplussb.com,https://appreal.sangsanginplussb.com,https://m.sangsanginplussb.com

# ==========================================
# 체크 주기 설정 (분 단위)
# ==========================================
check.interval.minutes=1

# ==========================================
# 임계값 설정
# ==========================================

# 응답 시간 경고 임계값 (밀리초)
# 이 값 이상이면 느린 응답으로 경고
response.time.warning.ms=3000

# 응답 시간 위험 임계값 (밀리초)
# 이 값 이상이면 위험으로 경고
response.time.critical.ms=5000

# SSL 인증서 만료 경고 기간 (일)
# 만료까지 이 일수 이하이면 경고
ssl.expiry.warning.days=30

# SSL 인증서 만료 위험 기간 (일)
# 만료까지 이 일수 이하이면 긴급 경고
ssl.expiry.critical.days=7

# HTTP 연결 타임아웃 (초)
http.connect.timeout.seconds=10

# HTTP 읽기 타임아웃 (초)
http.read.timeout.seconds=15
